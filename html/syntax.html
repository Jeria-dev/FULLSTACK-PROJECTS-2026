<!-- Comment - a comment is a statement in code that is not part of the instructions, a comment is surrounded by symbols -->

 <!-- HTML is made up of elements -->
 <!-- An element is written using <> symbols -->
 <!-- Elements usually come in parts like <p> and </p> -->
 <!-- The first tag is the opening tag , the second tag is the closing tag -->

<!-- The text inside the tags is the content of the element -->
 <h1>This is a heading</h1>

    <p id="main p">This is a paragraph.</p>
    <li>List item element</li>

    <!-- Attributes - an attribute can be placed within the opening tag of an element -->
    <!-- Attributes provide additional information about the element -->
     <a href="https://www.eldohub.co.ke" target="_blank">Visit Eldohub's website</a>

     <!-- Some elements are self closing -- meaning they do not have a closing tag -->

     <img src="https://eldohub.co.ke/wp-content/uploads/2025/06/KIJ_5411-960x1200.jpg" alt="Eldohub graduation 2024">
